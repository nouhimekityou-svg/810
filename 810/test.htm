<!DOCTYPE html>
<html lang="ja">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width">
	<title>スロット</title>
	<style>
		p{
			text-align: center;
		}
		@media screen and (max-width: 768px) {
    p{
        background-color: black;
         color:green;
     }
 }
 
 @media screen and (max-width: 480px) {
    p{
        background-color: black;
         color:red;
     }
 }
		input{
			font-size: 50px;
			margin: 0px 0px 20px 0px;
			padding: 0px 30px 0px 30px;
			border-radius: 8px;
		}
		img{
			width: 450px;
			height: 380px;
		}
	</style>
	<script>
		function setSound(id){
			var i = parseInt(Math.random() * 4);

	        // 画像と音声のペア（複数）を配列で定義
	        const items = [
	            { img: './1.jpg', sound: document.getElementById('sound1') },
	            { img: './2.png', sound: document.getElementById('sound2') },
	            { img: './3.jpg', sound: document.getElementById('sound3') },
	            { img: './4.png', sound: document.getElementById('sound4') }
	        ];

	        // 1. 画像を変更
	        document.getElementById(id).src = items[i].img;

	        // 2. 対応する音声を再生（連続再生のため先頭に戻す）
	        const currentSound = items[i].sound;
	            currentSound.currentTime = 0; 
	            currentSound.play().catch(error => {
	            	console.log("再生がブロックされました:", error);
	        });
		}
	</script>
</head>
<body>
	<audio id="sound1" preload="auto">
		<source src="./sound/nc116455_やりますねぇ！.wav" type="audio/wav">
	</audio>
	<audio id="sound2" preload="auto">
		<source src="./sound/nc51910_ンアッー！.mp3" type="audio/mp3">
	</audio>
	<audio id="sound3" preload="auto">
		<source src="./sound/nc108396_こ↑こ↓.wav" type="audio/wav">
	</audio>
	<audio id="sound4" preload="auto">
		<source src="./sound/nc150847_イキスギィ！.wav" type="audio/wav">
	</audio>
	<p>
		<input type="button" valu="・" onclick="setSound('img1')">
		<input type="button" valu="・" onclick="setSound('img2')">
		<input type="button" valu="・" onclick="setSound('img3')">
		<br>
		<img src="./1.jpg" id="img1">
		<img src="./2.png" id="img2">
		<img src="./3.jpg" id="img3">
	</p>
</body>
</html>
